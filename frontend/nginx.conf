server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx rejects bodies over 1 MB by default; resumes may be up to 5 MB.
    client_max_body_size 6m;

    # Serving the API under the same origin as the page means the browser needs no CORS.
    # Passing the original Host keeps the links the API generates (Location headers)
    # pointing at this server rather than at the internal container name.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
