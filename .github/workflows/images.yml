name: Images

# Builds the API and web images on every pull request and checks that they start and talk to
# each other. On main they are also published to GitHub Container Registry, tagged with the
# commit and as latest.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Registry names must be lowercase; the owner's login may not be.
      - name: Name the images
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "API_IMAGE=ghcr.io/$owner/prooffit-api" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/$owner/prooffit-web" >> "$GITHUB_ENV"

      - id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ env.PUBLISH }}
      - id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ env.PUBLISH }}

      # Each image is loaded into the runner's Docker for the smoke test and pushed only on main.
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # The web server forwards /api and /health to a host named api, as in Docker Compose.
      # The API needs no database to answer its liveness check, so none is started.
      - name: Check that the images start and work together
        run: |
          tag="sha-${{ github.sha }}"
          docker network create prooffit
          docker run -d --name api --network prooffit \
            -e ConnectionStrings__Default="Host=db;Database=prooffit;Username=prooffit;Password=unused" \
            "$API_IMAGE:$tag"
          docker run -d --name web --network prooffit -p 8080:80 "$WEB_IMAGE:$tag"
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health/live
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          echo "The page and the API answer through the web server."

      - name: Show container logs
        if: failure()
        run: docker logs api; docker logs web

      - name: Summarise
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Published images"
            echo '```'
            echo "${{ steps.api-meta.outputs.tags }}"
            echo "${{ steps.web-meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
