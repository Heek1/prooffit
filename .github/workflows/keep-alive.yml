name: Keep the demo awake

# The demo runs on free tiers: the API sleeps when idle and the database is paused after
# about a week without activity. One request a day that reaches the database prevents the
# pause and catches an outage early.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the API whether it can reach its database
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors \
            --max-time 90 https://prooffit-api.onrender.com/health/ready
