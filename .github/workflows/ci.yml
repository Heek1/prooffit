name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Written to only on main, to publish the coverage badge.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet tool restore
      - run: dotnet build --no-restore -warnaserror
      # The build rewrites the OpenAPI document the frontend's types come from; a change to the
      # API has to be committed with it.
      - run: git diff --exit-code -- ../frontend/openapi
      # The integration tests start PostgreSQL in Docker, which the runner provides.
      - run: dotnet test --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      # Generated code (regular expressions, OpenAPI, validation) and migrations are left
      # out, so the figure is about code written by hand.
      - name: Summarise coverage
        run: |
          dotnet reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -targetdir:coverage \
            -reporttypes:"MarkdownSummaryGithub;JsonSummary" -classfilters:"-System.*;-Microsoft.*;-ProofFit.Api.Data.Migrations.*"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      # The badge reads a shields.io endpoint file kept on its own branch, so main's history
      # does not fill with coverage commits.
      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          line=$(jq -r '.summary.linecoverage' coverage/Summary.json)
          color=$(jq -rn --argjson p "$line" 'if $p >= 90 then "brightgreen" elif $p >= 80 then "green" elif $p >= 70 then "yellowgreen" else "yellow" end')
          mkdir -p ../badge && cd ../badge
          jq -n --arg m "$line%" --arg c "$color" '{schemaVersion: 1, label: "coverage", message: $m, color: $c}' > coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Coverage $line%"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges
      # The keyword baseline is deterministic, so a drop in its accuracy is a regression.
      - run: dotnet run --project evals/ProofFit.Evals --no-build -- --min-accuracy 0.5
      - run: dotnet run --project evals/ProofFit.Evals --no-build -- --suite extraction --min-recall 0.85 --min-precision 0.9

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The committed types must be the ones the committed OpenAPI document produces.
      - run: npm run api:types && git diff --exit-code -- src/api.generated.ts
      - run: npm test
      - run: npm run build

  # The hosting Blueprint is checked against Render's published schema, so a typo is caught
  # here rather than when the Blueprint is next applied.
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run check-jsonschema==0.33.0 --schemafile https://render.com/schema/render.yaml.json render.yaml

  # Brings the production database up to date before the new API is deployed. Render deploys
  # a commit only once its checks pass, and this is one of them, so new code never starts on
  # an old schema. Migrations must keep working for the version still running until then
  # (add first, remove in a later release). See docs/decisions/0011.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e, blueprint]
    runs-on: ubuntu-latest
    environment: production
    # One migration at a time, and never cancelled halfway.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet tool restore
      # A bundle is a single executable holding the migrations; it reads the connection string
      # the way the API does, so a postgres:// URL works too.
      - run: dotnet ef migrations bundle --project src/ProofFit.Api --self-contained -r linux-x64 -o efbundle
      - name: Apply migrations
        env:
          ConnectionStrings__Default: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          if [ -z "$ConnectionStrings__Default" ]; then
            echo "::error::Set the DATABASE_CONNECTION_STRING secret to the production database."
            exit 1
          fi
          ./efbundle

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
